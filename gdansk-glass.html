<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gdańsk — Infinite Liquid Glass</title>

    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #11131d;
        color: white;
        font-family: Arial, sans-serif;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }

      .hud {
        position: fixed;
        inset: 28px 30px auto;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        align-items: start;
        pointer-events: none;
      }

      .eyebrow {
        font-size: 10px;
        letter-spacing: 0.24em;
        opacity: 0.65;
        margin-bottom: 9px;
      }

      h1 {
        font-size: clamp(28px, 5vw, 58px);
        font-weight: 400;
        letter-spacing: -0.04em;
        margin: 0;
      }

      .hint {
        font-size: 12px;
        opacity: 0.6;
        margin-top: 12px;
      }

      .back {
        color: white;
        text-decoration: none;
        border: 1px solid #ffffff50;
        padding: 11px 16px;
        border-radius: 30px;
        font-size: 12px;
        pointer-events: auto;
      }

      .status {
        position: fixed;
        bottom: 24px;
        left: 30px;
        z-index: 2;
        font-size: 11px;
        letter-spacing: 0.12em;
        opacity: 0.6;
        pointer-events: none;
      }

      @media (max-width: 600px) {
        .hud {
          inset: 20px 18px auto;
        }
        .status {
          left: 18px;
          bottom: 18px;
        }
      }
    </style>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.tsl.js"
        }
      }
    </script>
  </head>

  <body>
    <header class="hud">
      <div>
        <div class="eyebrow">DZIENNIK PODRÓŻY · 2025</div>
        <h1>Gdańsk, w kadrach.</h1>
        <div class="hint">Przeciągnij, aby odkrywać · Drag to explore</div>
      </div>

      <a class="back" href="gdansk.html">← Powrót</a>
    </header>

    <div class="status">INFINITE GALLERY / WEBGPU</div>

    <script type="module" src="js/liquid-glass.js"></script>
  </body>
</html>
